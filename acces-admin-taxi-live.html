<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accès Admin | Taxi Étoile Montréal</title>
  <link rel="stylesheet" href="admin-pro-redesign.css">
</head>
<body class="admin-page">
  <main class="login-screen">
    <section class="admin-hero">
      <img src="logo-taxi-etoile.png" alt="Taxi Étoile Montréal" style="max-width:190px;margin:0 0 18px;">
      <div class="badge">Dispatch Center</div>
      <h1>Connexion admin sécurisée</h1>
      <p style="color:#e5e7eb;font-size:18px;max-width:680px;">
        Connecte-toi pour gérer les réservations, le planning, les chauffeurs et les clients.
      </p>
    </section>

    <section class="admin-container">
      <form id="adminLoginForm" class="admin-login">
        <h2 style="color:#111827;margin-top:0;">Accès administrateur</h2>

        <label for="adminEmail">Email</label>
        <input id="adminEmail" type="email" autocomplete="email" placeholder="email@exemple.com" required>

        <label for="adminPassword">Mot de passe</label>
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Mot de passe" required>

        <button id="adminLoginBtn" type="submit">Se connecter</button>
        <p id="adminLoginMessage" style="color:#64748b;margin-top:12px;"></p>
      </form>

      <div class="quick-access">
        <h2 style="color:#111827;margin-top:0;">Accès rapide</h2>
        <p>Ouvre directement l’espace admin ou chauffeur après connexion.</p>
        <div class="actions">
          <a href="admin.html" class="button">Admin</a>
          <a href="chauffeurs.html" class="button">Chauffeur</a>
        </div>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-hamburger.js"></script>
<script src="admin-main.js"></script>
<script src="mail.js"></script>
<script src="admin-design-fix.js"></script>
<script src="admin-login-bridge.js"></script>
</body>
</html>
